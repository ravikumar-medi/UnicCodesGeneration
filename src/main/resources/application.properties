# HikariCP — resilient connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=480000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# ============================================================
# JPA
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# App Config
# ============================================================
app.generated-by=c
app.version-name=v
app.version-code=1
app.no-of-codes-for-lot=10000

app.secondary.generated-by=c
app.secondary.version-name=v
app.secondary.version-code=1
app.secondary.no-of-codes-for-lot=10000

app.success-message=Seed Codes generated successfully
app.success-code=200
app.error-message=Failed to generate codes. Please try again.
app.error-code=500

# ============================================================
# Logging — ✅ relative path, works on both local & server
# ============================================================
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.file.name=C:/logs/SeedCodesGeneration.log
#logging.file.name=/var/log/SeedCodesGeneration.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%-5p] [%t] %c{1}:%L - %m%n

