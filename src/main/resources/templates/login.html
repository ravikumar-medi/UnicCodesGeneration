<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Codes Generation</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #0f172a, #1e293b 60%, #334155);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: min(92vw, 420px);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
        }
        h2 {
            margin: 0 0 8px;
            font-size: 2rem;
            text-align: center;
        }
        .subtitle {
            color: #cbd5e1;
            text-align: center;
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
            color: #e2e8f0;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
        }
        input:focus {
            outline: 2px solid #38bdf8;
            border-color: transparent;
        }
        button {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        button:hover { transform: translateY(-1px); }
        .message {
            min-height: 22px;
            margin-top: 14px;
            font-size: 0.95rem;
            color: #fca5a5;
            text-align: center;
        }
        .demo-note {
            margin-top: 18px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Sign In</h2>
        <div class="subtitle">Codes Generation Portal</div>

        <form id="loginForm">
            <label for="userName">Username</label>
            <input id="userName" name="userName" type="text" value="ravikumarmedi" required />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" value="Ravi@J" required />

            <button type="submit">Login</button>
        </form>

        <div class="message" id="messageBox"></div>
        <div class="demo-note">User: ravikumarmedi / Password: Ravi@J</div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageBox = document.getElementById('messageBox');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            messageBox.textContent = 'Checking credentials...';

            const payload = {
                userName: document.getElementById('userName').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('loggedInUser', payload.userName);
                    messageBox.style.color = '#86efac';
                    messageBox.textContent = 'Login successful';
                    window.location.href = '/dashboard';
                    return;
                }

                messageBox.style.color = '#fca5a5';
                messageBox.textContent = result?.message || 'Invalid username or password';
            } catch (error) {
                messageBox.style.color = '#fca5a5';
                messageBox.textContent = 'Login failed. Please try again.';
            }
        });
    </script>
</body>
</html>
